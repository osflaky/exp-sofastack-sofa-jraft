name: build

on:
  workflow_dispatch:

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17
    - name: Check format
      run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V &&
        sh ./tools/check_format.sh

  test_jraft_core:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    needs: check_format
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
          # Temurin has no JDK 17 for Windows on arm64, and rocksdbjni ships only an
          # x64 DLL for Windows. Use the x64 JDK there (run by Windows' x64
          # emulation) so the JVM and the RocksDB native library match.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'x64' || matrix.arch }}
    - name: Maven Test
        # Use bash on every runner: PowerShell (the Windows default) splits
        # -Dmaven.javadoc.skip=true at the dot and breaks the mvn arguments.
      shell: bash
      run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V &&
        (mvn --projects jraft-core test || mvn --projects jraft-core test || mvn
        --projects jraft-core test)

    name: test_jraft_core [${{ matrix.expander_leg }}]
    timeout-minutes: 150
